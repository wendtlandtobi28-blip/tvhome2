<title>The Last Humanity</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: Vollbild-3D-Szene; Menues als zentrierte Archiv-Tafeln darueber, HUD an den Bildschirmkanten.
   Einheitlicher dunkler Look (bewusst nur ein Thema): Archiv bei Nacht, Gold = unentdeckt, Blau = archiviert. */
:root {
  color-scheme: dark;
  --ink: #0a0c11;          /* Grund */
  --slate: #12151d;        /* Tafel */
  --slate-edge: #2a2a2c;   /* Tafelrand */
  --paper: #ece6d8;        /* Lesetext */
  --muted: #9c968a;        /* Nebentext */
  --gold: #e6c47e;         /* unentdeckt, Ueberschriften */
  --memory: #74c6ff;       /* archivierte Erinnerung */
  --rust: #c0533c;         /* gesperrt */
  --veil: rgba(6, 8, 12, 0.78);
  --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
  --font-body: "Alegreya Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.2rem;
  --step-4: clamp(2.2rem, 6vw, 4.2rem);
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ink);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.5;
  overflow: hidden;
}
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

/* ---------- Tafeln (Menue, Text, Uebersicht, Optionen, Abspann) */
.screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--veil);
  z-index: 20;
}
.screen.light { background: rgba(6, 8, 12, 0.5); }
.tablet {
  width: min(920px, 100%);
  max-height: 100%;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--slate);
  border: 1px solid var(--slate-edge);
  border-top: 2px solid var(--gold);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
  padding: clamp(18px, 3vw, 34px);
  min-width: 0;
}
.tablet.memory { border-top-color: var(--memory); }
.scroll { overflow-y: auto; min-height: 0; padding-right: 6px; }
.eyebrow {
  font-size: var(--step--1); letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.eyebrow .kind { color: var(--memory); font-weight: 700; }
.eyebrow .kind.fiction { color: var(--gold); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; color: var(--gold); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: var(--step-4); letter-spacing: 0.06em; text-align: center; }
h2 { font-size: var(--step-3); }
h3 { font-size: var(--step-1); }
.mode { font-style: italic; color: var(--muted); }
.reading p { margin: 0 0 0.9em; max-width: 68ch; font-size: 1.12rem; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }

button {
  font: 600 var(--step-0)/1.2 var(--font-body);
  color: var(--paper);
  background: #1c2029;
  border: 1px solid #3a3a3e;
  padding: 11px 20px;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: background 120ms, border-color 120ms, color 120ms;
}
button:hover:not(:disabled) { background: #262b36; border-color: var(--gold); color: #fff; }
button:focus-visible { outline: 2px solid var(--memory); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.primary { border-color: var(--gold); color: var(--gold); }
button.small { font-size: var(--step--1); padding: 6px 12px; font-weight: 500; text-align: left; }

/* ---------- Hauptmenue */
#menu .tablet { width: min(520px, 100%); align-items: stretch; text-align: center; background: rgba(14, 16, 22, 0.86); }
#menu .subtitle { font-family: var(--font-display); color: var(--paper); letter-spacing: 0.18em; text-transform: uppercase; font-size: var(--step--1); margin-top: -6px; }
#menu .buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
#menu .controls { white-space: pre-line; color: var(--muted); font-size: var(--step--1); margin-top: 14px; }
#menu .note { color: var(--muted); font-style: italic; font-size: var(--step--1); }
#menu .note.warn { color: var(--rust); font-style: normal; }
#menu .confirm { border: 1px solid var(--rust); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
#menu .confirm .row { justify-content: center; }

/* ---------- Kapiteluebersicht */
.total { color: var(--memory); }
.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: #171a22; border-left: 3px solid #3a3a3e; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card.open { border-left-color: var(--gold); }
.card.done { border-left-color: var(--memory); }
.card.here { background: #18202a; }
.card.locked { opacity: 0.5; }
.card .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.card .status { font-size: var(--step--1); color: var(--memory); font-variant-numeric: tabular-nums; }
.card.locked .status { color: var(--muted); }
.card .era { font-style: italic; color: var(--muted); font-size: var(--step--1); }
.card .entries { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.card .enter { align-self: flex-end; margin-top: 6px; }

/* ---------- Optionen */
.opt { display: grid; grid-template-columns: 1fr minmax(0, 300px); gap: 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid #23262d; }
.opt label { cursor: pointer; }
.opt .ctl { display: flex; gap: 10px; align-items: center; }
.opt input[type=range] { flex: 1; accent-color: var(--gold); min-width: 0; }
.opt output { width: 3.2em; text-align: right; color: var(--gold); font-variant-numeric: tabular-nums; }
.opt input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--gold); }
.hint { color: var(--muted); font-style: italic; font-size: var(--step--1); }

/* ---------- Abspann */
#ending .tablet { text-align: center; }
#ending .reading p { margin-inline: auto; }
.stats { color: var(--memory); font-style: italic; }
#ending .row { justify-content: center; }

/* ---------- HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#chapterLine {
  position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); top: max(18px, env(safe-area-inset-top, 0px));
  font-family: var(--font-display); color: var(--gold); letter-spacing: 0.06em; font-size: var(--step--1);
  text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums;
}
#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255, 255, 255, 0.8); box-shadow: 0 0 3px #000; }
#prompt {
  position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.62); color: var(--gold); padding: 8px 18px; font-weight: 700; font-size: var(--step-1);
  max-width: calc(100% - 32px); text-align: center;
}
#toast {
  position: fixed; z-index: 25; pointer-events: none; left: 50%; bottom: max(28px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: rgba(6, 18, 28, 0.88); color: var(--memory); padding: 9px 20px; border: 1px solid rgba(116, 198, 255, 0.35);
  max-width: calc(100% - 32px); text-align: center;
}
#hint { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); color: rgba(255, 255, 255, 0.55); font-size: var(--step--1); text-shadow: 0 1px 2px #000; }
#lockHint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, 28px);
  color: var(--paper); background: rgba(0, 0, 0, 0.55); padding: 6px 14px; font-size: var(--step--1);
}

/* ---------- Laden / Fehler */
#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 30; background: var(--ink); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
#boot p { font-family: var(--font-display); color: var(--gold); letter-spacing: 0.1em; }
#boot.error p { font-family: var(--font-body); color: var(--paper); letter-spacing: 0; max-width: 40ch; }

@media (max-width: 560px) {
  .opt { grid-template-columns: 1fr; gap: 6px; }
  .row { justify-content: stretch; }
  .row button { flex: 1 1 auto; }
}
@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
}
</style>

<canvas id="scene" tabindex="0" aria-label="3D-Ansicht des Archivs"></canvas>

<div id="hud" hidden>
  <div id="chapterLine"></div>
  <div id="crosshair"></div>
  <div id="prompt" hidden></div>
  <div id="hint"></div>
  <div id="lockHint" hidden></div>
</div>

<div id="toast" hidden role="status" aria-live="polite"></div>

<div id="menu" class="screen" hidden></div>
<div id="info" class="screen light" hidden></div>
<div id="overview" class="screen" hidden></div>
<div id="options" class="screen" hidden></div>
<div id="ending" class="screen" hidden></div>

<div id="boot"><p>Das Archiv wird geöffnet …</p></div>

<script src="vendor/three.min.js"></script>
<script src="js/content_de.js"></script>
<script src="js/game.js"></script>
