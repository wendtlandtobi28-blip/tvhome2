name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Neueste ZIP-Datei entpacken
        run: |
          ZIP="$(LC_ALL=C ls -1 *.zip | tail -n 1)"
          echo "Verwende: $ZIP"
          unzip -qo "$ZIP"

      - name: APK bauen
        run: cd TvHome && gradle assembleDebug --no-daemon

      - name: APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TvHome
          files: TvHome/app/build/outputs/apk/debug/app-debug.apk
