name: Jarvis APK bauen

on:
  workflow_dispatch:
  push:
    paths:
      - "Jarvis/**"
      - ".github/workflows/jarvis.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android-Lizenzen akzeptieren
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK bauen
        run: cd Jarvis && gradle assembleDebug --no-daemon --stacktrace -PjarvisVersion=${{ github.run_number }}

      - name: APK umbenennen und Update-Datei erzeugen
        run: |
          cp Jarvis/app/build/outputs/apk/debug/app-debug.apk Jarvis.apk
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.${{ github.run_number }}\", \"apk\": \"Jarvis.apk\"}" > version.json
          cat version.json

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: |
            Jarvis.apk
            version.json

      - name: APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis
          name: Jarvis
          body: "Jarvis – Sprachassistent für Android-Tablets. Datei Jarvis.apk auf dem Tablet herunterladen und installieren."
          files: |
            Jarvis.apk
            version.json
